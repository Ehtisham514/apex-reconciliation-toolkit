name: Financial intelligence tests
on:
  push:
    paths:
      - 'financial_intelligence/**'
      - '.github/workflows/finance-model-tests.yml'
  pull_request:
    paths:
      - 'financial_intelligence/**'
      - '.github/workflows/finance-model-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r financial_intelligence/requirements-dashboard.txt
      - run: python -m pytest financial_intelligence -q

